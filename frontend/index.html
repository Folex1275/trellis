<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trellis - Trustless Milestone Escrow</title>
    <!-- Preconnect to Google Fonts origin before the stylesheet request so the
         TCP/TLS handshake is already in flight when the browser parses the
         <link> below. The crossorigin attribute is required for font fetches. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- font-display=swap is baked into the Google Fonts URL via the &display=swap
         query parameter. This tells the browser to render text immediately in the
         fallback font stack and swap to Inter once the download completes,
         eliminating the invisible-text period (FOUT fix, issue #100). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
