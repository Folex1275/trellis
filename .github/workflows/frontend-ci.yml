name: Frontend CI

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  # Allow maintainers to re-run the suite without pushing a commit.
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete — cancel it rather than
# paying for a result nobody will read.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test & build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      # Report every failing Node version in one run instead of stopping at
      # the first, so a version-specific break is obvious immediately.
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` over `npm install`: installs exactly the lockfile and fails
      # loudly if package.json and package-lock.json have drifted apart.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Uploaded from a single Node version — the artifact is for inspecting a
      # failed build, not for release, so two copies add nothing.
      - name: Upload production build
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
