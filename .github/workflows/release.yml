name: Release

# Pushing a `v*` tag (e.g. `v0.2.0`, `v0.2.0-test`) cuts a draft GitHub Release:
# changelog from conventional commits, plus the compiled contract WASM and CLI
# binaries attached as artifacts. Version bumps to Cargo.toml happen before the
# tag is pushed (that's what's being released), not inside this workflow.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

  build-contract:
    name: Build contract WASM
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build trellis_core WASM
        # `cargo rustc` targeting wasm32-unknown-unknown, not `stellar contract
        # build` (wasm32v1-none) — see DEPLOYMENT.md for why.
        run: |
          cargo rustc \
            --manifest-path=contracts/trellis_core/Cargo.toml \
            --crate-type=cdylib \
            --target=wasm32-unknown-unknown \
            --release

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: trellis_core-wasm
          path: target/wasm32-unknown-unknown/release/trellis_core.wasm

  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: trellis
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: trellis
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: trellis.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build trellis CLI
        run: cargo build --release --manifest-path=cli/trellis_cli/Cargo.toml --target=${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/trellis-${{ matrix.target }}${{ matrix.bin == 'trellis.exe' && '.exe' || '' }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: trellis-cli-${{ matrix.target }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: [changelog, build-contract, build-cli]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.changelog.outputs.version }}
          body_path: artifacts/changelog/CHANGELOG.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/trellis_core-wasm/trellis_core.wasm
            artifacts/trellis-cli-x86_64-unknown-linux-gnu/*
            artifacts/trellis-cli-x86_64-apple-darwin/*
            artifacts/trellis-cli-x86_64-pc-windows-msvc/*
